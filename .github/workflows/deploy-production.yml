name: Production Deployment

concurrency: production

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: 26

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://jerzual.github.io/minotaur/
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Build for production deployment
        run: pnpm run build --base=/minotaur/
      - name: Deploy to production with gh-pages
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pnpx gh-pages \
            --dist dist \
            --dest "." \
            --user "github-actions-bot <support+actions@github.com>" \
            --message "Deploy production to GitHub pages" \
            --nojekyll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
