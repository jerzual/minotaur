name: Staging Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  NODE_VERSION: 26

jobs:
  staging-deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment:
      name: staging/${{ github.head_ref }}
      url: http://jerzual.github.io/minotaur/${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short "$GITHUB_SHA")
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> "$GITHUB_ENV"
      - name: Build for staging deployment
        run: pnpm run build --base="/minotaur/${HEAD_REF}/"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - name: Deploy to staging with gh-pages
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pnpm run deploy \
            --dist dist \
            --dest "${HEAD_REF}" \
            --user "github-actions-bot <support+actions@github.com>" \
            --add \
            --message "Deploy ${COMMIT_SHORT_SHA} from ${HEAD_REF} to GitHub pages" \
            --nojekyll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}

  # Clean up staging environment on PR close
  staging-deletion:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Configure git
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
      - name: Delete staging environment on gh-pages branch
        run: |
          git rm -rf -- "${HEAD_REF}"
          git commit -m "Delete ${HEAD_REF} from GitHub pages"
          git push -u origin gh-pages

